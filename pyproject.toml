[project]
name = "memebot"
version = "0.1.0"
description = "Four-bot memecoin pipeline (Scout, Gatekeeper, Entry, Exit) with a journal — paper trading by default"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
memebot = "memebot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memebot", "memebot.data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
